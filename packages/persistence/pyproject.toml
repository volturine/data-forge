[project]
    name            = "dataforge-persistence"
    version         = "1.0.0"
    description     = "Data-Forge persistence-owned database models"
    requires-python = ">=3.14"
    dependencies = [
        "croniter",
        "dataforge-contracts",
        "sqlalchemy>=2.0",
        "sqlmodel>=0.0.24",
    ]

[tool.uv.sources]
    dataforge-contracts = { path = "../contracts", editable = true }

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["persistence"]

[tool.ruff]
    target-version = "py314"
    line-length    = 160
    indent-width   = 4

