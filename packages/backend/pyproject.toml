[project]
    name            = "dataforge-backend"
    version         = "1.0.0"
    description     = "Data-Forge FastAPI application package"
    requires-python = ">=3.14"
    dependencies = [
        "alembic",
        "boto3>=1.43.15",
        "croniter",
        "cryptography>=46.0.6",
        "duckdb",
        "fastexcel>=0.19.0",
        "fastapi",
        "fsspec",
        "httpx",
        "jsonschema>=4.0.0",
        "openpyxl",
        "polars",
        "psutil>=7.2.2",
        "psycopg[binary]>=3.3.3",
        "pydantic>=2.12",
        "pydantic-settings",
        "pyiceberg[pyarrow]>=0.7.0",
        "python-multipart",
        "requests",
        "sqlalchemy>=2.0",
        "sqlmodel>=0.0.24",
        "uvicorn",
        "websockets>=16.0",
        "xlsxwriter>=3.2.9",
]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.ruff]
    target-version = "py314"
    line-length    = 160
    indent-width   = 4

    [tool.ruff.lint]
        select = [
            "I",
            "E",
            "D",
            "F",
            "UP",
            "B",
            "SIM",
        ]

        ignore = [
            "E203",
            "D100",
            "D101",
            "D102",
            "D103",
            "D104",
            "D105",
            "D106",
            "D107",
            "D205",
            "D212",
            "UP045",
            "N812",
            "COM812",
            "RET504",
            "RUF100",
            "B008",
            "B904",
        ]

        [tool.ruff.lint.isort]
            combine-as-imports = true
            known-first-party = ["api", "backend_contracts", "backend_core", "modules"]

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pyupgrade]
            keep-runtime-typing = true

    [tool.ruff.format]
        quote-style                = "single"
        line-ending                = "auto"
        indent-style               = "space"
        skip-magic-trailing-comma  = false
        docstring-code-line-length = "dynamic"

[tool.mypy]
    mypy_path = [
        ".",
        "../worker",
        "../..",
    ]
    exclude = ["(^|/)conftest\\.py$"]

[tool.pytest.ini_options]
    asyncio_mode = "auto"
    testpaths = ["tests"]
    pythonpath = [
        ".",
        "tests",
        "../worker",
        "../..",
    ]
    python_files = ["test_*.py"]
    python_classes = ["Test*"]
    python_functions = ["test_*"]
    timeout = 30
    cache_dir = "tests/.artifacts/pytest-cache"
    addopts = ["-v", "--strict-markers", "--tb=short"]
    markers = ["asyncio: mark test as async"]

[dependency-groups]
    dev = [
        "mypy>=1.19.1",
        "pytest>=9.0.3",
        "pytest-asyncio>=1.3.0",
        "pytest-cov>=7.1.0",
        "pytest-timeout>=2.4.0",
        "pytest-xdist>=3.8.0",
        "ruff>=0.14.7",
        "types-jsonschema>=4.26.0.20260202",
        "types-openpyxl>=3.1.5.20250919",
    ]

[tool.hatch.build.targets.wheel]
    packages = ["api", "backend_contracts", "backend_core", "modules"]
    include  = ["main.py", "database/**"]
