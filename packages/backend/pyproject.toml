[project]
    name            = "dataforge-backend"
    version         = "1.0.0"
    description     = "Data-Forge FastAPI application package"
    requires-python = ">=3.14"
    dependencies = [
        "alembic>=1.18.4",
        "boto3>=1.43.28",
        "croniter>=6.2.2",
        "cryptography>=46.0.6",
        "fastapi>=0.136.3",
        "fsspec>=2026.4.0",
        "httpx>=0.28.1",
        "jsonschema>=4.0.0",
        "openpyxl>=3.1.5",
        "psutil>=7.2.2",
        "psycopg[binary]>=3.3.3",
        "pydantic>=2.12",
        "pydantic-settings>=2.14.1",
        "pyiceberg[pyarrow]>=0.7.0",
        "python-multipart",
        "requests>=2.34.2",
        "SQLAlchemy>= 2.0.50",
        "sqlmodel>=0.0.24",
        "uvicorn>=0.49.0",
        "websockets>=16.0",
        "xlsxwriter>=3.2.9",
        "grpcio>=1.81.0",
        "protobuf>=7.35.1",
        "protovalidate>=1.2.0",
]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.ruff]
    target-version = "py314"
    line-length    = 160
    indent-width   = 4
    extend-exclude = ["buf", "dataforge_protocol"]

    [tool.ruff.lint]
        select = [
            "I",
            "E",
            "D",
            "F",
            "UP",
            "B",
            "SIM",
        ]

        ignore = [
            "E203",
            "D100",
            "D101",
            "D102",
            "D103",
            "D104",
            "D105",
            "D106",
            "D107",
            "D205",
            "D212",
            "UP045",
            "N812",
            "COM812",
            "RET504",
            "RUF100",
            "B008",
            "B904",
        ]

        [tool.ruff.lint.isort]
            combine-as-imports = true
            known-first-party = ["api", "backend_core", "backend_grpc", "modules"]

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pyupgrade]
            keep-runtime-typing = true

    [tool.ruff.format]
        quote-style                = "single"
        line-ending                = "auto"
        indent-style               = "space"
        skip-magic-trailing-comma  = false
        docstring-code-line-length = "dynamic"

[tool.mypy]
    mypy_path = [
        ".",
        "../..",
    ]
    exclude = ["(^|/)conftest\\.py$", "buf", "dataforge_protocol"]

[tool.pytest.ini_options]
    asyncio_mode = "auto"
    testpaths = ["tests"]
    pythonpath = [
        ".",
        "tests",
        "../..",
    ]
    python_files = ["test_*.py"]
    python_classes = ["Test*"]
    python_functions = ["test_*"]
    timeout = 30
    cache_dir = "tests/.artifacts/pytest-cache"
    addopts = ["-v", "--strict-markers", "--tb=short"]
    markers = ["asyncio: mark test as async"]

[dependency-groups]
    dev = [
        "fastexcel>=0.19.0",
        "mypy>=2.1.0",
        "polars[rtcompat]>=1.41.2",
        "pytest>=9.0.3",
        "pytest-asyncio>=1.4.0",
        "pytest-cov>=7.1.0",
        "pytest-timeout>=2.4.0",
        "pytest-xdist>=3.8.0",
        "ruff>=0.15.17",
        "types-grpcio>=1.0.0.20260607",
        "types-jsonschema>=4.26.0.20260518",
        "types-openpyxl>=3.1.5.20260518",
        "types-protobuf>=7.34.1.20260518",
]

[tool.hatch.build.targets.wheel]
    packages = ["api", "backend_core", "backend_grpc", "buf", "dataforge_protocol", "modules"]
    include  = ["main.py", "database/**"]
