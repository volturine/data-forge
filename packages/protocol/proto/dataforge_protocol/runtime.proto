syntax = "proto3";

package dataforge.runtime;

import "buf/validate/validate.proto";
import "dataforge_protocol/compute.proto";
import "dataforge_protocol/errors.proto";
import "google/protobuf/struct.proto";

message RuntimeEvent {
  string namespace = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_-]+$"];
  oneof payload {
    BuildEvent build = 2;
    ComputeCommandEnvelope compute_command = 3;
    ComputeResponseEnvelope compute_response = 4;
    ErrorInfo error = 5;
    google.protobuf.Struct raw = 6;
  }
}
