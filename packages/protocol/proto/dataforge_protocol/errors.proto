syntax = "proto3";

package dataforge.runtime;

import "google/protobuf/struct.proto";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ID = 1;
  ERROR_CODE_DATASOURCE_NOT_FOUND = 2;
  ERROR_CODE_ANALYSIS_NOT_FOUND = 3;
  ERROR_CODE_ANALYSIS_VERSION_NOT_FOUND = 4;
  ERROR_CODE_STEP_NOT_FOUND = 5;
  ERROR_CODE_ENGINE_NOT_FOUND = 6;
  ERROR_CODE_ENGINE_BUSY = 7;
  ERROR_CODE_ENGINE_RUN_NOT_FOUND = 8;
  ERROR_CODE_JOB_NOT_FOUND = 9;
  ERROR_CODE_JOB_CANCELLED = 10;
  ERROR_CODE_SCHEDULE_NOT_FOUND = 11;
  ERROR_CODE_UDF_NOT_FOUND = 12;
  ERROR_CODE_HEALTHCHECK_NOT_FOUND = 13;
  ERROR_CODE_VALIDATION = 14;
  ERROR_CODE_SNAPSHOT = 15;
  ERROR_CODE_CONNECTION = 16;
  ERROR_CODE_UNSUPPORTED_EXPORT_FORMAT = 17;
  ERROR_CODE_AUTH = 18;
  ERROR_CODE_DATASOURCE_VALIDATION_ERROR = 19;
  ERROR_CODE_DATASOURCE_SNAPSHOT_ERROR = 20;
  ERROR_CODE_DATASOURCE_CONNECTION_ERROR = 21;
  ERROR_CODE_PIPELINE_VALIDATION_ERROR = 22;
  ERROR_CODE_PIPELINE_EXECUTION_ERROR = 23;
  ERROR_CODE_ENGINE_START_ERROR = 24;
  ERROR_CODE_ENGINE_RUN_COMPARISON_ERROR = 25;
  ERROR_CODE_ANALYSIS_VALIDATION_ERROR = 26;
  ERROR_CODE_ANALYSIS_CYCLE_ERROR = 27;
  ERROR_CODE_FILE_NOT_FOUND = 28;
  ERROR_CODE_FILE_VALIDATION_ERROR = 29;
  ERROR_CODE_FILE_SIZE_EXCEEDED = 30;
  ERROR_CODE_FILE_DELETE_ERROR = 31;
  ERROR_CODE_SCHEDULE_VALIDATION_ERROR = 32;
  ERROR_CODE_UDF_VALIDATION_ERROR = 33;
  ERROR_CODE_HEALTHCHECK_VALIDATION_ERROR = 34;
  ERROR_CODE_SETTINGS_CONFIGURATION_ERROR = 35;
  ERROR_CODE_INVALID_CREDENTIALS = 36;
  ERROR_CODE_EMAIL_ALREADY_EXISTS = 37;
  ERROR_CODE_SESSION_EXPIRED = 38;
  ERROR_CODE_ACCOUNT_DISABLED = 39;
  ERROR_CODE_DEFAULT_USER_DELETION_FORBIDDEN = 40;
  ERROR_CODE_PROVIDER_UNLINK_ERROR = 41;
  ERROR_CODE_OAUTH_ERROR = 42;
  ERROR_CODE_TOKEN_EXPIRED = 43;
  ERROR_CODE_TOKEN_INVALID = 44;
}

message ErrorInfo {
  ErrorCode code = 1;
  string message = 2;
  google.protobuf.Struct details = 3;
}
