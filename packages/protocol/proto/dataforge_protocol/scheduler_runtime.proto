syntax = "proto3";

package dataforge.runtime;

import "buf/validate/validate.proto";
import "dataforge_protocol/common.proto";

service SchedulerRuntimeService {
  rpc RegisterScheduler(SchedulerRegisterRequest) returns (RuntimeWorkerResponse);
  rpc HeartbeatScheduler(RuntimeWorkerRequest) returns (RuntimeWorkerResponse);
  rpc StopScheduler(RuntimeWorkerRequest) returns (RuntimeWorkerResponse);
  rpc ListDueScheduleNamespaces(EmptyRequest) returns (SchedulerDueNamespacesResponse);
  rpc RunDueSchedules(SchedulerRunDueRequest) returns (SchedulerRunDueResponse);
}

message SchedulerRegisterRequest {
  string worker_id = 1 [(buf.validate.field).string.min_len = 1];
  string hostname = 2 [(buf.validate.field).string.min_len = 1];
  int32 pid = 3 [(buf.validate.field).int32.gt = 0];
  int32 capacity = 4 [(buf.validate.field).int32.gte = 1];
}

message SchedulerEnqueuedRun {
  string namespace = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_-]+$"];
  string schedule_id = 2 [(buf.validate.field).string.min_len = 1];
  string datasource_id = 3 [(buf.validate.field).string.min_len = 1];
  string build_id = 4 [(buf.validate.field).string.min_len = 1];
}

message SchedulerDueNamespace {
  string namespace = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_-]+$"];
  int64 generation = 2 [(buf.validate.field).int64.gte = 1];
}

message SchedulerDueNamespacesResponse {
  repeated SchedulerDueNamespace namespaces = 1;
}

message SchedulerRunDueRequest {
  string worker_id = 1 [(buf.validate.field).string.min_len = 1];
  string target_namespace = 2 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_-]+$"];
  int64 generation = 3 [(buf.validate.field).int64.gte = 1];
}

message SchedulerRunFailure {
  string namespace = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_-]+$"];
  string schedule_id = 2 [(buf.validate.field).string.min_len = 1];
  string datasource_id = 3 [(buf.validate.field).string.min_len = 1];
  string error = 4 [(buf.validate.field).string.min_len = 1];
}

message SchedulerRunDueResponse {
  bool handled = 1;
  repeated SchedulerEnqueuedRun enqueued = 2;
  repeated SchedulerRunFailure failures = 3;
}
