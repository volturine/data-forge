syntax = "proto3";

package dataforge.runtime;

import "google/protobuf/struct.proto";

message EmptyRequest {}

message RuntimeWorkerRequest {
  string worker_id = 1;
}

message RuntimeWorkerResponse {
  string worker_id = 1;
}

message JsonPayload {
  google.protobuf.Struct value = 1;
}

message JsonPayloadList {
  repeated JsonPayload values = 1;
}

message NotificationAttachment {
  string filename = 1;
  string content_base64 = 2;
  string content_type = 3;
}
