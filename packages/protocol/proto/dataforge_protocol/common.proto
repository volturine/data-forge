syntax = "proto3";

package dataforge.runtime;

import "buf/validate/validate.proto";
import "dataforge_protocol/enums.proto";

message EmptyRequest {
  // Recovery RPCs use this optional field to direct work to one namespace;
  // existing empty-request callers remain valid.
  string namespace = 1;
}

message RuntimeWorkerRequest {
  string worker_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 protocol_version = 2;
  repeated ComputeRequestKind allowed_compute_request_kinds = 3;
  reserved 4;
  reserved "compute_namespace_offset";
  // Claim RPCs are directed to one namespace. The worker gets this value from
  // the matching runtime notification or from its bounded recovery cursor;
  // the backend must never scan every tenant to satisfy one claim.
  string target_namespace = 5;
}

message RuntimeWorkerResponse {
  string worker_id = 1 [(buf.validate.field).string.min_len = 1];
}

message NotificationAttachment {
  string filename = 1 [(buf.validate.field).string.min_len = 1];
  string content_base64 = 2 [(buf.validate.field).string.min_len = 1];
  string content_type = 3 [(buf.validate.field).string.min_len = 1];
}
