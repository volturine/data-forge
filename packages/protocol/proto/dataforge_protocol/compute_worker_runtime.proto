syntax = "proto3";

package dataforge.runtime;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// The worker-to-compute-worker transport. This service is intentionally independent of
// the durable backend compute-request protocol: it carries already-normalized
// Polars work to exactly one compute worker identity.
service PolarsComputeWorkerService {
  rpc Initialize(ComputeWorkerInitializeRequest) returns (ComputeWorkerInitializeResponse);
  rpc Health(ComputeWorkerHealthRequest) returns (ComputeWorkerHealthResponse);
  rpc SubmitJob(ComputeWorkerSubmitJobRequest) returns (ComputeWorkerJobReference);
  rpc WatchJob(ComputeWorkerWatchJobRequest) returns (stream ComputeWorkerJobEvent);
  rpc GetJobResult(ComputeWorkerGetJobResultRequest) returns (ComputeWorkerJobResult);
  rpc CancelJob(ComputeWorkerCancelJobRequest) returns (ComputeWorkerCancelJobResponse);
  rpc Shutdown(ComputeWorkerShutdownRequest) returns (ComputeWorkerShutdownResponse);
}

message ComputeWorkerInitializeRequest {
  int32 protocol_version = 1 [(buf.validate.field).int32.gte = 1];
  // Keep the field name for protobuf JSON compatibility.
  string engine_identity = 2 [(buf.validate.field).string.min_len = 1];
  string token = 3 [(buf.validate.field).string.min_len = 1];
  string object_store_endpoint = 4;
  string object_store_region = 5;
  string object_store_access_key = 6;
  string object_store_secret_key = 7;
  optional string object_store_session_token = 8;
  int32 polars_max_threads = 9 [(buf.validate.field).int32.gte = 0];
  int32 polars_streaming_chunk_size = 10 [(buf.validate.field).int32.gte = 0];
}

message ComputeWorkerInitializeResponse {
  // Keep the field name for protobuf JSON compatibility.
  string engine_identity = 1 [(buf.validate.field).string.min_len = 1];
  bool ready = 2;
}

message ComputeWorkerHealthRequest {}

message ComputeWorkerHealthResponse {
  // Keep the field name for protobuf JSON compatibility.
  string engine_identity = 1 [(buf.validate.field).string.min_len = 1];
  int32 protocol_version = 2 [(buf.validate.field).int32.gte = 1];
  string application_version = 3 [(buf.validate.field).string.min_len = 1];
  bool ready = 4;
}

message ComputeWorkerSubmitJobRequest {
  reserved 4;
  reserved "payload";

  int32 protocol_version = 1 [(buf.validate.field).int32.gte = 1];
  string job_id = 2 [(buf.validate.field).string.min_len = 1];
  string kind = 3 [(buf.validate.field).string = {
    in: "preview"
    in: "export"
    in: "schema"
    in: "row_count"
    in: "datasource_schema"
    in: "datasource_column_stats"
    in: "datasource_snapshot_compare"
    in: "datasource_stage"
    in: "excel_preflight"
    in: "excel_preview"
    in: "excel_resolve_selection"
  }];
  bytes payload_json = 5 [(buf.validate.field).bytes.min_len = 2];
}

message ComputeWorkerJobReference {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ComputeWorkerWatchJobRequest {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 after_sequence = 2 [(buf.validate.field).int32.gte = 0];
}

message ComputeWorkerGetJobResultRequest {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ComputeWorkerCancelJobRequest {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ComputeWorkerCancelJobResponse {
  bool accepted = 1;
}

message ComputeWorkerJobEvent {
  reserved 4;
  reserved "progress";

  string job_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 sequence = 2 [(buf.validate.field).int32.gte = 1];
  google.protobuf.Timestamp emitted_at = 3 [(buf.validate.field).required = true];
  oneof event {
    ComputeWorkerJobResult result = 5;
    bytes progress_json = 6;
  }
}

message ComputeWorkerJobResult {
  reserved 2, 5;
  reserved "data", "error_details";

  string job_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string error = 3;
  optional string error_kind = 4;
  google.protobuf.Struct step_timings = 6 [(buf.validate.field).required = true];
  optional string query_plan = 7;
  optional double read_duration_ms = 8;
  optional double write_duration_ms = 9;
  optional double collect_duration_ms = 10;
  optional bytes data_json = 12;
  optional bytes error_details_json = 13;
}

message ComputeWorkerShutdownRequest {}

message ComputeWorkerShutdownResponse {
  bool accepted = 1;
}
