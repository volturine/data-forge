version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - WIRE_JSON
  except:
    - ENUM_VALUE_NO_DELETE_UNLESS_NAME_RESERVED
    - ENUM_VALUE_NO_DELETE_UNLESS_NUMBER_RESERVED
    - RPC_SAME_REQUEST_TYPE
    - RPC_SAME_RESPONSE_TYPE
  # Temporary for layer 2 of #224: these internal message type names are
  # changing without changing field numbers, field names, or persisted tokens.
  # Remove this exception in the next stacked PR after this schema is the base.
  ignore_only:
    FIELD_WIRE_JSON_COMPATIBLE_TYPE:
      - proto/dataforge_protocol/compute.proto
      - proto/dataforge_protocol/worker_runtime.proto
