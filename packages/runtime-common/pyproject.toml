[project]
    name            = "dataforge-runtime-common"
    version         = "1.0.0"
    description     = "Data-Forge runtime transport helpers"
    requires-python = ">=3.14"
    dependencies = [
        "dataforge-contracts",
        "psycopg[binary]>=3.3.3",
    ]

[tool.uv.sources]
    dataforge-contracts = { path = "../contracts", editable = true }

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["runtime_common"]

[tool.ruff]
    target-version = "py314"
    line-length    = 160
    indent-width   = 4

