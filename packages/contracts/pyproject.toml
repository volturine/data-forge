[project]
    name            = "dataforge-contracts"
    version         = "1.0.0"
    description     = "Data-Forge pure contracts, schemas, and enum definitions"
    requires-python = ">=3.14"
    dependencies = [
        "pydantic>=2.12",
        "polars",
    ]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["contracts"]

[tool.ruff]
    target-version = "py314"
    line-length    = 160
    indent-width   = 4

