[project]
    name            = "dataforge-scheduler"
    version         = "1.0.0"
    description     = "Data-Forge scheduler runtime package"
    requires-python = ">=3.14"
    dependencies    = []

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.ruff]
    target-version = "py314"
    line-length    = 160
    indent-width   = 4

[tool.mypy]
    mypy_path = [
        ".",
        "../..",
    ]
    exclude = ["(^|/)conftest\\.py$"]

[tool.pytest.ini_options]
    cache_dir = "tests/.artifacts/pytest-cache"

[dependency-groups]
    dev = [
        "mypy>=1.19.1",
        "pytest>=9.0.3",
        "pytest-asyncio>=1.3.0",
        "pytest-cov>=7.1.0",
        "pytest-timeout>=2.4.0",
        "pytest-xdist>=3.8.0",
        "ruff>=0.14.7",
    ]

[tool.hatch.build.targets.wheel]
    only-include = ["main.py"]
