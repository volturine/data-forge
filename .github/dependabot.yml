version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /packages/frontend
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: uv
    directories:
      - /packages/backend
      - /packages/scheduler
      - /packages/worker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        group-by: dependency-name
        patterns:
          - "*"
