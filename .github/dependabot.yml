version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /packages/frontend
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 needs svelte-check --tsgo plus both TS 6 and TS 7
      # installed, and typescript-eslint (<6.1.0) / @sveltejs/kit (^5 || ^6)
      # peers still reject it.
      - dependency-name: typescript
        versions:
          - ">=7"

  - package-ecosystem: uv
    directories:
      - /packages/backend
      - /packages/scheduler
      - /packages/worker
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        group-by: dependency-name
        patterns:
          - "*"
