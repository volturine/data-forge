version: 2

# One open pull request for every ecosystem and directory. The group schedule
# replaces the per-ecosystem schedule.
multi-ecosystem-groups:
  weekly-batch:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: weekly-batch

  - package-ecosystem: docker
    directory: /docker
    patterns:
      - "*"
    multi-ecosystem-group: weekly-batch

  - package-ecosystem: docker-compose
    directory: /docker
    patterns:
      - "*"
    multi-ecosystem-group: weekly-batch

  - package-ecosystem: bun
    directories:
      - /packages/frontend
      - /packages/protocol
    patterns:
      - "*"
    ignore:
      # The typescript package supplies the TS 6 compiler API for Svelte/ESLint.
      # Native TS 7 is installed separately as @typescript/native for --tsgo checks.
      - dependency-name: typescript
        versions:
          - ">=7"
    multi-ecosystem-group: weekly-batch

  - package-ecosystem: uv
    directories:
      - /packages/backend
      - /packages/protocol
      - /packages/scheduler
      - /packages/worker
    patterns:
      - "*"
    multi-ecosystem-group: weekly-batch
