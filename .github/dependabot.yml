version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /packages/frontend
    schedule:
      interval: weekly
    ignore:
      # svelte-check and typescript-eslint still require the TypeScript 6 JS API.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # v9 removes createTable and needs a DataTable.svelte rewrite.
      - dependency-name: "@tanstack/table-core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /packages/backend
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /packages/scheduler
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /packages/worker
    schedule:
      interval: weekly
