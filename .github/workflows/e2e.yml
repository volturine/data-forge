name: E2E tests

on:
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    env:
      E2E_SHARDS: "3"
      E2E_API_WORKERS: "4"
      E2E_OPENROUTER_API_KEY: ${{ secrets.E2E_OPENROUTER_API_KEY }}
      # Leave compute headroom for previews and cleanup during browser tests.
      PW_E2E_WORKERS: "2"
    steps:
      - name: Reclaim stale E2E Docker resources before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_CLEANUP_REPOSITORY: ${{ github.repository }}
          # Fetch the trusted helper before checkout; PR heads may not contain it.
          E2E_CLEANUP_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          helper_url="https://api.github.com/repos/${E2E_CLEANUP_REPOSITORY}/contents/scripts/ci/cleanup_e2e_runner.sh?ref=${E2E_CLEANUP_REF}"
          if ! curl --fail --silent --show-error --location --retry 2 \
            --header 'Accept: application/vnd.github.raw+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$helper_url" \
            | env -u GH_TOKEN -u E2E_OPENROUTER_API_KEY bash -s -- pre; then
            echo '::warning::Could not run the pre-checkout E2E cleanup helper.' >&2
          fi

      - name: Guard runner disk before checkout
        run: |
          set -euo pipefail
          docker_root_dir="$(docker info --format '{{.DockerRootDir}}')"
          minimum_free_bytes=$((20 * 1024 * 1024 * 1024))
          for path in "$GITHUB_WORKSPACE" "$docker_root_dir"; do
            available_bytes="$(df -P -B1 "$path" | awk 'NR == 2 { print $4 }')"
            if [[ ! "$available_bytes" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not determine free disk space for ${path}." >&2
              exit 1
            fi
            if ((available_bytes < minimum_free_bytes)); then
              available_gib="$(awk -v bytes="$available_bytes" 'BEGIN { printf "%.1f", bytes / 1024 / 1024 / 1024 }')"
              echo "::error::E2E runner has ${available_gib} GiB free on ${path}; at least 20 GiB is required." >&2
              exit 1
            fi
            available_gib="$(awk -v bytes="$available_bytes" 'BEGIN { printf "%.1f", bytes / 1024 / 1024 / 1024 }')"
            echo "E2E runner has ${available_gib} GiB free on ${path}."
          done

      - uses: actions/checkout@v7
        with:
          # Keep checkout from deleting any remaining root-owned ignored output.
          clean: false

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Runner diagnostics before E2E
        run: |
          echo '--- host memory ---'
          free -h 2>&1 | head -n 8 || true
          sed -n '1,8p' /proc/meminfo 2>/dev/null || true
          echo '--- host load ---'
          uptime 2>&1 | head -n 2 || true
          echo '--- Docker daemon ---'
          docker info --format 'Containers={{.Containers}} Running={{.ContainersRunning}} Paused={{.ContainersPaused}} Stopped={{.ContainersStopped}} Images={{.Images}} MemTotal={{.MemTotal}} CPUs={{.NCPU}}' 2>&1 | head -n 5 || true
          echo '--- Docker containers ---'
          docker ps -a --no-trunc 2>&1 | head -n 35 || true
          echo '--- Docker resource use ---'
          docker stats --no-stream 2>&1 | head -n 25 || true
          echo '--- readable kernel OOM messages ---'
          (dmesg --ctime 2>/dev/null || journalctl -k --no-pager -n 250 2>/dev/null) | grep -Ei 'out of memory|oom-kill|killed process' | tail -n 30 || true

      - name: Test E2E runner cleanup race handling
        run: bash scripts/ci/test_cleanup_e2e_runner.sh

      - name: Run full E2E suite and permanent 50-tab probe
        run: just test-e2e

      - name: Runner diagnostics after E2E
        if: always()
        run: |
          echo '--- host memory ---'
          free -h 2>&1 | head -n 8 || true
          sed -n '1,8p' /proc/meminfo 2>/dev/null || true
          echo '--- host load ---'
          uptime 2>&1 | head -n 2 || true
          echo '--- Docker daemon ---'
          docker info --format 'Containers={{.Containers}} Running={{.ContainersRunning}} Paused={{.ContainersPaused}} Stopped={{.ContainersStopped}} Images={{.Images}} MemTotal={{.MemTotal}} CPUs={{.NCPU}}' 2>&1 | head -n 5 || true
          echo '--- Docker containers ---'
          docker ps -a --no-trunc 2>&1 | head -n 35 || true
          echo '--- Docker resource use ---'
          docker stats --no-stream 2>&1 | head -n 25 || true
          echo '--- readable kernel OOM messages ---'
          (dmesg --ctime 2>/dev/null || journalctl -k --no-pager -n 250 2>/dev/null) | grep -Ei 'out of memory|oom-kill|killed process' | tail -n 30 || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-e2e-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .test-artifacts/**

      - name: Cleanup E2E runner Docker resources
        if: always()
        shell: bash
        run: bash scripts/ci/cleanup_e2e_runner.sh post
