name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verification
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.4"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Install backend dependencies
        working-directory: packages/backend
        run: uv sync

      - name: Install scheduler dependencies
        working-directory: packages/scheduler
        run: uv sync

      - name: Install worker dependencies
        working-directory: packages/worker
        run: uv sync

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: bun install --frozen-lockfile

      - name: Canonical verification
        run: just verify

  python-tests:
    name: ${{ matrix.suite }}
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [backend-unit, backend-integration, worker, scheduler]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.10.4"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Generate protocol code
        run: just generate-protocol

      - name: Install suite dependencies
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          case "$TEST_SUITE" in
            backend-unit)
              (cd packages/backend && uv sync)
              ;;
            backend-integration)
              (cd packages/backend && uv sync)
              (cd packages/worker && uv sync)
              (cd packages/scheduler && uv sync)
              ;;
            worker)
              (cd packages/worker && uv sync)
              ;;
            scheduler)
              (cd packages/scheduler && uv sync)
              ;;
            *)
              echo "Unknown Python test suite: $TEST_SUITE" >&2
              exit 2
              ;;
          esac

      - name: Run suite
        env:
          DATAFORGE_SKIP_PROTOCOL_GENERATE: "1"
        run: just test-${{ matrix.suite }}

  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: [verify, python-tests]
    if: always()
    steps:
      - name: Require verification and every Python suite to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" || "$PYTHON_TESTS_RESULT" != "success" ]]; then
            echo "Verification: $VERIFY_RESULT; Python test matrix: $PYTHON_TESTS_RESULT" >&2
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.4"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Generate protocol code
        run: just generate-protocol

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: bun install --frozen-lockfile

      - name: Generate frontend styles
        working-directory: packages/frontend
        run: bun run panda:codegen

      - name: Frontend unit tests
        working-directory: packages/frontend
        run: bun run test:unit

  e2e:
    name: e2e
    needs: [backend, frontend]
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    timeout-minutes: 35
    permissions:
      contents: read
    # E2E runtime defaults are centralized in docker/env/e2e.env so local and
    # CI runs exercise the same concurrency, memory, and timeout settings.
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
          version: "0.10.4"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Generate protocol code
        run: just generate-protocol

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: bun install --frozen-lockfile

      - name: Pull isolated Playwright runtime
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./packages/frontend/node_modules/playwright/package.json').version")"
          docker pull "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"

      - name: Run e2e tests
        env:
          E2E_STACK_ID: ci-${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p .artifacts/ci/e2e
          export E2E_LOG_DIR="$PWD/.artifacts/ci/e2e/services"
          export DATAFORGE_SKIP_PROTOCOL_GENERATE=1
          just test-e2e 2>&1 | tee .artifacts/ci/e2e/e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "e2e step hit the harness timeout (E2E_TIMEOUT_SECONDS) before the job timeout"
          fi
          exit "$status"

      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .artifacts/ci/e2e/
            packages/frontend/tests/.artifacts/playwright/

  publish-images:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: data-forge-api
            target: api
          - image_name: data-forge-scheduler
            target: scheduler
          - image_name: data-forge-runtime
            target: runtime
          - image_name: data-forge-polars-engine
            target: engine
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::12}"
          branch_tag="${GITHUB_REF_NAME}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:${branch_tag}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:sha-${short_sha}"
            if [ "$GITHUB_REF_NAME" = "master" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  publish-pr-images:
    # PR / pre-merge images use a dev- prefix and never share production tags.
    # Same-repo PRs may push dev-* tags; fork PRs never get a push job.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: data-forge-api
            target: api
          - image_name: data-forge-scheduler
            target: scheduler
          - image_name: data-forge-runtime
            target: runtime
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:dev-${{ github.event.pull_request.number }}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:dev-sha-${GITHUB_SHA::12}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
