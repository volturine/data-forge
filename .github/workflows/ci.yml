name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.10.4"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Generate protocol code
        run: just generate-protocol

      - name: Install backend dependencies
        working-directory: packages/backend
        run: uv sync

      - name: Install scheduler dependencies
        working-directory: packages/scheduler
        run: uv sync

      - name: Install worker dependencies
        working-directory: packages/worker
        run: uv sync

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: bun install --frozen-lockfile

      - name: Canonical verification
        run: just verify

      - name: Canonical tests
        run: |
          # Self-hosted runners retain resources from prior jobs. The engine
          # integration tests build an image, so reclaim all unused Docker
          # state instead of retaining a day's build cache.
          docker container prune --force
          docker volume prune --force
          docker builder prune --all --force
          docker image prune --force
          docker system df
          df -h
          just test

  frontend:
    name: frontend
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.10.4"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Generate protocol code
        run: just generate-protocol

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: bun install --frozen-lockfile

      - name: Frontend static checks
        working-directory: packages/frontend
        run: bun run panda:codegen && bun run check && bun run lint

      - name: Frontend unit tests
        working-directory: packages/frontend
        run: bun run test:unit

  e2e:
    name: e2e
    needs: [backend, frontend]
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PORT: "8001"
      FRONTEND_PORT: "3001"
      # Match the pre-Docker parallel e2e default (4). Bootstrap is now bounded
      # and fails visibly, so we no longer serialize browsers to hide shell hangs.
      # No Playwright retries.
      # Four browsers match pre-Docker e2e. Engine admission queues above the
      # real production-style capacity instead of increasing the limit for CI.
      PW_E2E_WORKERS: "4"
      BUILD_WORKER_MIN_PROCESSES: "4"
      BUILD_WORKER_MAX_PROCESSES: "4"
      COMPUTE_REQUEST_CONCURRENCY: "4"
      MAX_CONCURRENT_ENGINES: "8"
      POLARS_MAX_MEMORY_MB: "256"
      E2E_TIMEOUT_SECONDS: "1500"
      LOG_LEVEL: "warning"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
          version: "0.10.4"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Generate protocol code
        run: just generate-protocol

      - name: Install backend dependencies
        working-directory: packages/backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: bun install --frozen-lockfile

      - name: Pull isolated Playwright runtime
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('./packages/frontend/node_modules/playwright/package.json').version")"
          docker pull "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"

      - name: Reclaim unused Docker state
        run: |
          # Free stopped containers/volumes without wiping the engine image
          # build cache. A cold 2.5GB engine rebuild dominates e2e wall time.
          docker container prune --force
          docker volume prune --force
          docker image prune --force
          docker system df
          df -h

      - name: Run e2e tests
        run: |
          set -o pipefail
          mkdir -p .artifacts/ci/e2e
          export E2E_LOG_DIR="$PWD/.artifacts/ci/e2e/services"
          export DATAFORGE_SKIP_PROTOCOL_GENERATE=1
          just test-e2e 2>&1 | tee .artifacts/ci/e2e/e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "e2e step hit the harness timeout (E2E_TIMEOUT_SECONDS) before the job timeout"
          fi
          exit "$status"

      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .artifacts/ci/e2e/
            packages/frontend/tests/.artifacts/playwright/

  publish-images:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: data-forge-api
            target: api
          - image_name: data-forge-scheduler
            target: scheduler
          - image_name: data-forge-worker
            target: worker
          - image_name: data-forge-polars-engine
            target: engine
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::12}"
          branch_tag="${GITHUB_REF_NAME}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:${branch_tag}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:sha-${short_sha}"
            if [ "$GITHUB_REF_NAME" = "master" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
