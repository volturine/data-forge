name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.10.4"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Install backend dependencies
        working-directory: packages/backend
        run: uv sync

      - name: Install scheduler dependencies
        working-directory: packages/scheduler
        run: uv sync

      - name: Install worker dependencies
        working-directory: packages/worker
        run: uv sync

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: bun install --frozen-lockfile

      - name: Canonical verification
        run: just verify

  python-tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [backend-unit, backend-integration, worker, scheduler]
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Run suite
        run: just test-${{ matrix.suite }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.suite }}-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .test-artifacts/**

  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: [verify, python-tests]
    if: always()
    steps:
      - name: Require verification and every Python suite to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" || "$PYTHON_TESTS_RESULT" != "success" ]]; then
            echo "Verification: $VERIFY_RESULT; Python test matrix: $PYTHON_TESTS_RESULT" >&2
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Frontend unit tests
        run: just test-frontend

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-frontend-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .test-artifacts/**

  e2e:
    name: e2e
    runs-on: [self-hosted, linux, x64]
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'master' }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Runner diagnostics before E2E
        run: |
          echo '--- host memory ---'
          free -h 2>&1 | head -n 8 || true
          sed -n '1,8p' /proc/meminfo 2>/dev/null || true
          echo '--- host load ---'
          uptime 2>&1 | head -n 2 || true
          echo '--- Docker daemon ---'
          docker info --format 'Containers={{.Containers}} Running={{.ContainersRunning}} Paused={{.ContainersPaused}} Stopped={{.ContainersStopped}} Images={{.Images}} MemTotal={{.MemTotal}} CPUs={{.NCPU}}' 2>&1 | head -n 5 || true
          echo '--- Docker containers ---'
          docker ps -a --no-trunc 2>&1 | head -n 35 || true
          echo '--- Docker resource use ---'
          docker stats --no-stream 2>&1 | head -n 25 || true
          echo '--- readable kernel OOM messages ---'
          (dmesg --ctime 2>/dev/null || journalctl -k --no-pager -n 250 2>/dev/null) | grep -Ei 'out of memory|oom-kill|killed process' | tail -n 30 || true

      - name: Run end-to-end tests
        run: just test-e2e

      - name: Runner diagnostics after E2E
        if: always()
        run: |
          echo '--- host memory ---'
          free -h 2>&1 | head -n 8 || true
          sed -n '1,8p' /proc/meminfo 2>/dev/null || true
          echo '--- host load ---'
          uptime 2>&1 | head -n 2 || true
          echo '--- Docker daemon ---'
          docker info --format 'Containers={{.Containers}} Running={{.ContainersRunning}} Paused={{.ContainersPaused}} Stopped={{.ContainersStopped}} Images={{.Images}} MemTotal={{.MemTotal}} CPUs={{.NCPU}}' 2>&1 | head -n 5 || true
          echo '--- Docker containers ---'
          docker ps -a --no-trunc 2>&1 | head -n 35 || true
          echo '--- Docker resource use ---'
          docker stats --no-stream 2>&1 | head -n 25 || true
          echo '--- readable kernel OOM messages ---'
          (dmesg --ctime 2>/dev/null || journalctl -k --no-pager -n 250 2>/dev/null) | grep -Ei 'out of memory|oom-kill|killed process' | tail -n 30 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-e2e-${{ github.run_id }}
          if-no-files-found: warn
          include-hidden-files: true
          path: .test-artifacts/**

  publish-images:
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: data-forge-api
            target: api
          - image_name: data-forge-scheduler
            target: scheduler
          - image_name: data-forge-runtime
            target: runtime
          - image_name: data-forge-polars-engine
            target: engine
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::12}"
          branch_tag="${GITHUB_REF_NAME}"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:${branch_tag}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:sha-${short_sha}"
            if [ "$GITHUB_REF_NAME" = "master" ]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  publish-pr-images:
    # PR / pre-merge images use a dev- prefix and never share production tags.
    # Same-repo PRs may push dev-* tags; fork PRs never get a push job.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: data-forge-api
            target: api
          - image_name: data-forge-scheduler
            target: scheduler
          - image_name: data-forge-runtime
            target: runtime
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:dev-${{ github.event.pull_request.number }}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image_name }}:dev-sha-${GITHUB_SHA::12}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
