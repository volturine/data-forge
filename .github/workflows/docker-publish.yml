name: Docker Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  BUN_VERSION: 1.3.11
  UV_VERSION: 0.9.5

jobs:
  # Dev channel: every PR publishes dev-pr-<number> images and master publishes
  # a rolling dev-master image (linux/amd64 only). These feed the dev /
  # PR-preview deployment stacks in the central deployments workspace.
  dev:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: data-forge-api
          - target: scheduler
            image: data-forge-scheduler
          - target: worker
            image: data-forge-worker
          - target: engine
            image: data-forge-polars-engine
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Compute image tag and lowercase owner
        id: tag
        run: |
          echo "owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=dev-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-master" >> "$GITHUB_OUTPUT"
          fi

      # Fork PRs cannot write to GHCR; publish only same-repo PR branches.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          platforms: linux/amd64
          tags: '${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}'
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUN_VERSION=${{ env.BUN_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}
            UV_VERSION=${{ env.UV_VERSION }}

  # Release channel: v* tags publish pinned multi-arch images.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: data-forge-api
          - target: scheduler
            image: data-forge-scheduler
          - target: worker
            image: data-forge-worker
          - target: engine
            image: data-forge-polars-engine
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUN_VERSION=${{ env.BUN_VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}
            UV_VERSION=${{ env.UV_VERSION }}

  release:
    needs: publish
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          OWNER_LC="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          API_IMAGE="${REGISTRY}/${OWNER_LC}/data-forge-api"
          SCHEDULER_IMAGE="${REGISTRY}/${OWNER_LC}/data-forge-scheduler"
          WORKER_IMAGE="${REGISTRY}/${OWNER_LC}/data-forge-worker"
          ENGINE_IMAGE="${REGISTRY}/${OWNER_LC}/data-forge-polars-engine"
          COMPOSE_URL="https://github.com/${REPO}/blob/${TAG}/docker/compose.yaml"
          PROD_ENV_URL="https://github.com/${REPO}/blob/${TAG}/docker/env/prod.env"
          DEPLOY_URL="https://github.com/${REPO}/blob/${TAG}/docs/DEPLOYMENT.md"

          NOTES_FILE="$(mktemp)"
          {
            echo "## Container images"
            echo
            echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`) images published to GHCR:"
            echo
            echo "| Role | Image |"
            echo "| --- | --- |"
            echo "| API | \`${API_IMAGE}:${VERSION}\` |"
            echo "| Scheduler | \`${SCHEDULER_IMAGE}:${VERSION}\` |"
            echo "| Worker | \`${WORKER_IMAGE}:${VERSION}\` |"
            echo "| Polars engine | \`${ENGINE_IMAGE}:${VERSION}\` |"
            echo
            echo "Also tagged as \`${TAG}\`, \`latest\`, and major/minor aliases."
            echo
            echo "### Pull"
            echo
            echo '```bash'
            echo "docker pull ${API_IMAGE}:${VERSION}"
            echo "docker pull ${SCHEDULER_IMAGE}:${VERSION}"
            echo "docker pull ${WORKER_IMAGE}:${VERSION}"
            echo "docker pull ${ENGINE_IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "## Deploy with Docker Compose"
            echo
            echo "Recommended production path uses the checked-in stack:"
            echo
            echo "- Compose file: [\`docker/compose.yaml\`](${COMPOSE_URL})"
            echo "- Env template: [\`docker/env/prod.env\`](${PROD_ENV_URL})"
            echo "- Full guide: [\`docs/DEPLOYMENT.md\`](${DEPLOY_URL})"
            echo
            echo "1. Copy \`docker/env/prod.env\` and replace every \`replace-with-...\` value."
            echo "2. Pin all three application images to this release:"
            echo
            echo '```env'
            echo "DF_API_IMAGE=${API_IMAGE}:${VERSION}"
            echo "DF_SCHEDULER_IMAGE=${SCHEDULER_IMAGE}:${VERSION}"
            echo "DF_WORKER_IMAGE=${WORKER_IMAGE}:${VERSION}"
            echo "DF_ENGINE_IMAGE=${ENGINE_IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "3. Start the stack:"
            echo
            echo '```bash'
            echo "docker compose --env-file docker/env/prod.env \\"
            echo "  -p dataforge-prod \\"
            echo "  -f docker/compose.yaml \\"
            echo "  pull"
            echo "docker compose --env-file docker/env/prod.env \\"
            echo "  -p dataforge-prod \\"
            echo "  -f docker/compose.yaml \\"
            echo "  up -d"
            echo '```'
            echo
            echo "Keep API, scheduler, and worker on the same release tag."
            echo
          } > "$NOTES_FILE"

          PREV_TAG="$(gh release list --limit 20 --json tagName,isDraft,isPrerelease \
            --jq "[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != \"${TAG}\")][0].tagName // empty")"

          if [ -n "$PREV_TAG" ]; then
            gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREV_TAG" \
              --jq .body >> "$NOTES_FILE"
          else
            gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq .body >> "$NOTES_FILE"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Release ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --latest \
              --verify-tag
          fi
